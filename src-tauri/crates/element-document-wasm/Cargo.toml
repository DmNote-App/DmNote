[package]
name = "element-document-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "편집 창(메인·분리 패널)이 쓰는 요소 문서 엔진 WASM 바인딩"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
element-document = { path = "../element-document" }
serde = "1.0"
serde_json = "1.0"
# CLI(wasm-bindgen 0.2.126)와 같은 버전이어야 한다
wasm-bindgen = "=0.2.126"
